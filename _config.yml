title: "Demostraciones – Tarea 1"
author: "Jairo Andrés Serrano Meléndez — Profesor: PhD. Lihki Rubio"
copyright: "2026"
logo: ""
only_build_toc_files: true

execute:
  execute_notebooks: "off"

sphinx:
  config:
    language: es
    html_show_copyright: true
    mathjax3_config:
      tex:
        macros:
          D: "\\mathcal{D}"
          X: "\\mathcal{X}"
          Y: "\\mathcal{Y}"
          E: "\\mathbb{E}"
          Prob: "\\mathbb{P}"
          ind: "\\mathbf{1}"
          x: "\\boldsymbol{x}"
          y: "\\boldsymbol{y}"
          bm: ["\\boldsymbol{#1}", 1]
          bb: "\\boldsymbol{\\beta}"
          bbh: "\\hat{\\boldsymbol{\\beta}}"
          btheta: "\\boldsymbol{\\theta}"
          eps: "\\boldsymbol{\\varepsilon}"
          one: "\\mathbf{1}"
          zero: "\\mathbf{0}"
          Cov: "\\operatorname{Cov}"
          Var: "\\operatorname{Var}"
          tr: "\\operatorname{tr}"
          sign: "\\operatorname{sign}"
          sgn: "\\operatorname{sgn}"
          diag: "\\operatorname{diag}"
          Gini: "\\operatorname{Gini}"
          argmin: "\\operatorname*{arg\\,min}"

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist

html:
  use_issues_button: false
  use_repository_button: false
  home_page_in_navbar: true
